name: Deploy

# Cloudflare Pages 主部署方式为 Git 集成（push 到 main 自动构建），
# 本工作流为备用方案：使用 wrangler 手动触发部署。
# 使用前在仓库 Settings → Secrets 配置：CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter web build
        env:
          NUXT_AUTH_SECRET: ${{ secrets.NUXT_AUTH_SECRET }}
          NUXT_ADMIN_USERNAME: ${{ secrets.NUXT_ADMIN_USERNAME }}
          NUXT_ADMIN_PASSWORD_HASH: ${{ secrets.NUXT_ADMIN_PASSWORD_HASH }}
          NUXT_GITHUB_TOKEN: ${{ secrets.NUXT_GITHUB_TOKEN }}
          NUXT_GITHUB_OWNER: ${{ secrets.NUXT_GITHUB_OWNER }}
          NUXT_GITHUB_REPO: ${{ secrets.NUXT_GITHUB_REPO }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/dist --project-name=my-blog
